<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Welcome — Kaalamithra AI Tech Solutions</title>
<style>
* { box-sizing: border-box; }
body { margin:0; font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif; background:linear-gradient(135deg,#0f172a,#1e1b4b 55%,#312e81); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; color:#0f172a; }
.card { width:100%; max-width:480px; background:#fff; border-radius:20px; padding:40px 34px; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.35); }
.logo { width:62px; height:62px; margin:0 auto 12px; border-radius:16px; background:linear-gradient(135deg,#2563eb,#7c3aed); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:28px; }
h1 { font-size:24px; margin:0; letter-spacing:.06em; }
.tag { color:#7c3aed; font-size:11.5px; font-weight:700; letter-spacing:.14em; margin:6px 0 2px; }
h2 { font-size:19px; margin:18px 0 4px; }
.sub { color:#64748b; font-size:13.5px; margin:0 0 24px; }
.opt { display:block; width:100%; margin:10px 0; padding:15px; border-radius:12px; font-size:15px; font-weight:700; cursor:pointer; text-decoration:none; border:0; }
.opt.login { background:linear-gradient(135deg,#0f172a,#312e81); color:#fff; }
.opt.signup { background:linear-gradient(135deg,#2563eb,#7c3aed); color:#fff; }
.opt:hover { filter:brightness(1.08); }
.note { margin-top:16px; font-size:12px; color:#94a3b8; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">K</div>
  <h1>KAALAMITHRA</h1>
  <div class="tag">AI TECH SOLUTIONS &bull; IDEA TODAY. IMPACT TOMORROW.</div>
  <h2>Welcome</h2>
  <div class="sub">Have an account? Log in. New here? Create your client account.</div>
  <a class="opt login" href="/login">LOGIN</a>
  <a class="opt signup" href="/signup">SIGN UP</a>
  <div class="note">New public registrations are always CLIENT accounts.</div>
</div>
</body>
</html>
