<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin Login — Kaalamithra</title>
<style>
:root { --bg:#0f172a; --card:#ffffff; --accent:#2563eb; --accent2:#7c3aed; --muted:#64748b; --err:#dc2626; }
* { box-sizing: border-box; }
body { margin:0; font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; background: linear-gradient(135deg,#0f172a,#1e1b4b 55%,#312e81); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
.card { width:100%; max-width:420px; background:var(--card); border-radius:18px; padding:32px 30px; box-shadow:0 20px 60px rgba(0,0,0,.35); }
.brand { display:flex; align-items:center; gap:10px; margin-bottom:6px; }
.brand .logo { width:42px; height:42px; border-radius:12px; background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:20px; }
h1 { font-size:22px; margin:0; color:#0f172a; }
.sub { color:var(--muted); font-size:13.5px; margin:4px 0 22px; }
label { display:block; font-size:13px; font-weight:600; color:#334155; margin:14px 0 6px; }
input { width:100%; padding:12px 13px; border:1.5px solid #e2e8f0; border-radius:10px; font-size:14.5px; outline:none; }
input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(37,99,235,.12); }
button { width:100%; margin-top:20px; padding:13px; border:0; border-radius:10px; font-size:15px; font-weight:700; color:#fff; background:linear-gradient(135deg,var(--accent),var(--accent2)); cursor:pointer; }
button:disabled { opacity:.65; cursor:wait; }
.msg { display:none; margin-top:14px; padding:11px 12px; border-radius:10px; font-size:13.5px; }
.msg.err { display:block; background:#fef2f2; color:var(--err); border:1px solid #fecaca; }
.msg.ok { display:block; background:#f0fdf4; color:#15803d; border:1px solid #bbf7d0; }
.back { display:block; text-align:center; margin-top:16px; font-size:13px; color:var(--muted); text-decoration:none; }
.back:hover { color:var(--accent); }
.hint { margin-top:14px; font-size:12px; color:#94a3b8; text-align:center; }
  .pass-wrap { position: relative; }
  .pass-wrap input { padding-right: 40px; }
  .eye-btn { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; padding: 4px; color: #64748b; width: auto !important; margin: 0 !important; display: flex; align-items: center; justify-content: center; }
  .eye-btn:hover { color: #0066cc; }
</style>
</head>
<body>
<div class="card">
  <div class="brand"><div class="logo">K</div><div><h1>Admin Login</h1><div class="sub">Kaalamithra AI Tech Solutions</div></div></div>
  <div class="sub" style="margin-top:-14px">Admins only. Clients please use <a href="/client/login">Client Login</a>.</div>
  <form id="f" onsubmit="return doLogin(event)" autocomplete="off">
    <label for="email">Admin email</label>
    <input id="email" type="email" autocomplete="off" placeholder="Enter admin email" />
    <label for="pass">Admin password</label>
    <div class="pass-wrap">
        <input id="pass" type="password" autocomplete="new-password" placeholder="Enter admin password" /><button type="button" class="eye-btn" onclick="togglePass('pass')" aria-label="Show password">
          <svg class="eye-on" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="eye-off" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>
      </div>
    <div id="msg" class="msg"></div>
    <button id="btn" type="submit">Sign in securely</button>
  </form>
  <div class="hint">Credentials are verified on the server. Nothing secret lives in this page.</div>
  <a class="back" href="/welcome">← Back to Welcome</a>
</div>
<script>
var API = location.origin;
function show(t, ok) {
  var m = document.getElementById('msg');
  m.textContent = t || ''; m.className = 'msg ' + (ok ? 'ok' : 'err');
}
// If already logged in as admin, skip login (also blocks back-button-after-logout confusion:
// dashboard itself re-validates the session on every load).
fetch(API + '/api/admin/me', { credentials: 'include' })
  .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
  .then(function (x) { if (x.ok && x.d.success) location.replace('/admin/dashboard'); })
  .catch(function () {});
function doLogin(e) {
  if (e) e.preventDefault();
  var email = document.getElementById('email').value.trim();
  var pass = document.getElementById('pass').value;
  if (!email || !pass) { show('Please enter admin email and password.'); return false; }
  var btn = document.getElementById('btn');
  btn.disabled = true; btn.textContent = 'Signing in...'; show('', true);
  fetch(API + '/api/admin/login', {
    method: 'POST', credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: email, password: pass })
  }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
  .then(function (x) {
    if (x.ok && x.d.success) {
      try { localStorage.setItem('km_admin_token', x.d.token); } catch (e) {}
      show('Login successful. Redirecting...', true);
      setTimeout(function () { location.replace('/admin/dashboard'); }, 400);
    } else {
      show((x.d && x.d.error) || 'Invalid admin credentials.');
    }
  }).catch(function () { show('Cannot reach the server. Is the backend running on port 5000?'); })
  .finally(function () { btn.disabled = false; btn.textContent = 'Sign in securely'; });
  return false;
}

function togglePass(id) {
  var input = document.getElementById(id);
  var isPassword = input.type === "password";
  input.type = isPassword ? "text" : "password";
  var icons = (input.parentElement ? input.parentElement.querySelector(".eye-btn") : null) || document.querySelector("#" + id + " ~ button");
  if (icons) {
    var on = icons.querySelector(".eye-on"), off = icons.querySelector(".eye-off");
    if (on && off) { on.style.display = isPassword ? "none" : "block"; off.style.display = isPassword ? "block" : "none"; }
    icons.setAttribute("aria-label", isPassword ? "Hide password" : "Show password");
  }
}
</script>
</body>
</html>
